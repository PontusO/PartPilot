[project]
name = "partpilot"
version = "0.1.0"
description = "PartPilot — internal MRP (catalog, assemblies, orders, purchasing) with a Digi-Key/Mouser BOM resolver."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "fpdf2>=2.8.7",
]

[project.scripts]
partpilot = "partpilot.cli:app"
digisearch = "partpilot.cli:app"   # legacy alias (pre-rename name); safe to drop once no unit/script uses it

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
